<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operations — 5th Corner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-black: #000000;
            --color-near-black: #0a0a0a;
            --color-dark: #111111;
            --color-dark-gray: #1a1a1a;
            --color-mid-gray: #666666;
            --color-light-gray: #999999;
            --color-off-white: #e8e8e8;
            --color-white: #ffffff;
            --font-heading: 'Space Grotesk', 'Helvetica Neue', sans-serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
            background: var(--color-near-black);
            color: var(--color-off-white);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
        }

        .admin-header {
            background: var(--color-black);
            padding: 0 clamp(1rem, 3vw, 2rem);
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .admin-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .admin-title h1 {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.3em;
            color: var(--color-white);
            text-transform: uppercase;
        }

        .admin-status {
            font-family: var(--font-body);
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--color-mid-gray);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .admin-nav {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .admin-nav a {
            font-family: var(--font-body);
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-light-gray);
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .admin-nav a:hover {
            color: var(--color-white);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .dashboard-container {
            width: 100%;
            height: calc(100vh - 56px);
            position: relative;
            background: var(--color-near-black);
        }

        iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
            background: var(--color-near-black);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--color-near-black);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--color-light-gray);
            margin-bottom: 1.5rem;
        }

        .loading-bar {
            width: 120px;
            height: 1px;
            background: var(--color-dark-gray);
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--color-white);
            animation: loadBar 1.5s ease-in-out infinite;
        }

        @keyframes loadBar {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            z-index: 60;
        }

        .error-message.visible {
            display: block;
        }

        .error-message .error-label {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 0.3em;
            color: var(--color-light-gray);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .error-message .error-detail {
            font-family: var(--font-body);
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--color-mid-gray);
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            .admin-header {
                padding: 0 1rem;
                height: 48px;
            }

            .admin-title h1 {
                font-size: 0.65rem;
            }

            .admin-status {
                display: none;
            }

            .dashboard-container {
                height: calc(100vh - 48px);
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="admin-title">
            <h1>Operations</h1>
            <div class="admin-status">Real-time monitoring</div>
        </div>
        <nav class="admin-nav">
            <a href="{{ url_for('home') }}">&larr; Home</a>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-text">Loading</div>
            <div class="loading-bar"></div>
        </div>

        <div class="error-message" id="errorMessage">
            <div class="error-label">Connection Error</div>
            <div class="error-detail">Dashboard unavailable.<br>Check connection or try again later.</div>
        </div>

        <iframe
            id="dashboardFrame"
            src="{{ game_api_url }}/admin"
            title="Game Operations Dashboard"
            allow="clipboard-write">
        </iframe>
    </div>

    <script>
        var iframe = document.getElementById('dashboardFrame');
        var loading = document.getElementById('loadingOverlay');
        var errorMsg = document.getElementById('errorMessage');
        var loadTimeout;

        iframe.addEventListener('load', function() {
            clearTimeout(loadTimeout);
            setTimeout(function() {
                loading.classList.add('hidden');
            }, 500);
        });

        loadTimeout = setTimeout(function() {
            if (!loading.classList.contains('hidden')) {
                loading.classList.add('hidden');
                errorMsg.classList.add('visible');
            }
        }, 30000);

        iframe.addEventListener('error', function() {
            clearTimeout(loadTimeout);
            loading.classList.add('hidden');
            errorMsg.classList.add('visible');
        });
    </script>
</body>
</html>
